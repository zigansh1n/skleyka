name: tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-compatible:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install latest compatible dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Lint and format
        if: matrix.python-version == '3.12'
        run: |
          ruff check openscenesense tests scripts benchmarks Examples
          ruff format --check openscenesense tests scripts benchmarks Examples
      - name: Enforce core coverage
        if: matrix.python-version == '3.12'
        run: |
          python -m coverage run --source=openscenesense -m pytest
          python -m coverage report --include='openscenesense/frame_selectors.py,openscenesense/models.py,openscenesense/cache.py,openscenesense/exceptions.py' --fail-under=85
      - name: Verify generated schema
        if: matrix.python-version == '3.12'
        run: python scripts/export_schema.py && git diff --exit-code -- Docs/analysis_result.schema.json

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install minimum runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install -c constraints/minimum.txt openai numpy opencv-python Pillow ffmpeg-python pytest==8.0.0 jsonschema==4.23.0
      - name: Test minimum set
        run: python -m pytest
      - name: Verify dependency consistency
        run: python -m pip check
